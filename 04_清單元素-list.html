<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清單元素</title>
</head>
<body>
  <h1>清單元素</h1>
  <h2>項目清單</h2>
  <ul>
    <!-- li{單一項目內容$}*5 -->
    <li>單一項目內容1</li>
    <li>單一項目內容2</li>
    <li>單一項目內容3</li>
    <li>單一項目內容4</li>
    <li>單一項目內容5</li>
  </ul>

  <hr>
  <h2>序號清單</h2>
  <!-- ol>li{單一項目內容$$}*5 -->
  <ol>
    <li>單一項目內容01</li>
    <li>單一項目內容02</li>
    <li>單一項目內容03</li>
    <li>單一項目內容04</li>
    <li>單一項目內容05</li>
  </ol>
</body>
</html>
