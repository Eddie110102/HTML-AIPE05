<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表單元素</title>
    <link rel="stylesheet" href="./styles/form.css" />
  </head>
  <body>
    <h1>表單元素</h1>
    <!-- 14...html?key=value&key=value... -->
    <form action="#" method="get" enctype="application/x-www-form-urlencoded">
      <!-- 單行文字控制項 -->
      <label for="myName">姓名</label>
      <input
        type="text"
        name="userName"
        value="王大明"
        placeholder="請輸入您的大名"
        id="myName"
      />
      <!-- 密碼控制項 -->
      <label for="myPWD">密碼</label>
      <input
        type="password"
        name="userPassword"
        id="myPWD"
        value=""
        placeholder="請輸入6-8位字元"
        maxlength="8"
        minlength="6"
      />
      <!-- 多行文字控制項 -->
      <label for="myMemo">備忘錄</label>
      <textarea name="userMemo" id="myMemo" cols="30" rows="10" placeholder="最大上限150字。" maxlength="150">預設文字</textarea>
    </form>
  </body>
</html>
