<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字樣式</title>
  </head>
  <body>
    <h1>文字樣式</h1>
    <h2>文字顏色</h2>
    <p style="color: #00ff7f;">段落元素</p>
    <p style="color: #0e79dd;">段落元素</p>
    <p>段落元素</p>
    <hr>
    <h2>文字大小</h2>
    <span style="font-size: 40px;">行內容器 (40px)</span>
    <span style="font-size: 8px;">行內容器 (8px)</span>
    <span style="font-size: 70%;">行內容器 (70%)</span>
    <span style="color: red;">行內容器 (預設大小)</span>
    <span style="font-size: 2em;">行內容器 (2em)</span>
    <span style="font-size: 2rem;">行內容器 (2rem)</span>
    <span style="font-size: 1vw;">行內容器 (1vw)</span>
    <span style="font-size: 1vh;">行內容器 (1vh)</span>
  </body>
</html>
